html, body, #canvas { margin: 0; padding: 0; border: 0; }
html, body { width: 100%; height: 100%; height: 100dvh; }
body { color: #e8d6a8; background-color: #0d0608; overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#rw-fs-tip {
	display: none; position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
	z-index: 10; max-width: 90vw; padding: 8px 16px;
	background: rgba(20, 10, 12, 0.94); border: 1px solid #8a6a2e; border-radius: 6px;
	color: #e8d6a8; font: 13px/1.35 Georgia, serif; text-align: center;
	box-shadow: 0 4px 14px rgba(0, 0, 0, 0.65); cursor: pointer;
}
/* the loader stays over the game until the title screen has drawn (no black screen) */
#status {
	position: absolute; inset: 0; z-index: 2;
	background: #0d0608;
	display: flex; flex-direction: column; justify-content: center; align-items: center;
	transition: opacity 0.4s ease;
}
#status.gone { opacity: 0; pointer-events: none; }
#rw-logo { width: min(64vw, 640px); height: auto; user-select: none; }
#rw-bar {
	margin-top: 4vh; width: min(50vw, 420px); height: 6px;
	border: 1px solid #8a6a2e; border-radius: 4px; background: #1d1012; overflow: hidden;
}
#rw-fill { height: 100%; width: 0%; background: linear-gradient(#f4d488, #c9962f); transition: width 0.2s linear; }
#rw-pct { margin-top: 1.2vh; font: 14px Georgia, serif; color: #c9a868; min-height: 18px; }
#status-notice {
	display: none; margin: 3vh 2rem 0; padding: 1rem; max-width: 520px;
	background: #3a1c22; border: 1px solid #9b3943; border-radius: 0.5rem;
	color: #e0e0e0; font-family: Arial, sans-serif; line-height: 1.3; text-align: center;
}

// Detect CPU software WebGL (WARP / SwiftShader / llvmpipe), cap backing resolution, and pace rAF
// without Godot's Engine.max_fps busy-wait loop (OS_Web::delay_usec spins 100% CPU in WASM).
(function () {
	let isSwGL = false;
	try {
		const tc = document.createElement('canvas');
		const gl = tc.getContext('webgl2') || tc.getContext('webgl');
		if (gl) {
			const ext = gl.getExtension('WEBGL_debug_renderer_info');
			const ren = ext ? String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) || '') : String(gl.getParameter(gl.RENDERER) || '');
			if (/Basic Render|WARP|SwiftShader|llvmpipe|Software|Mesa OffScreen/i.test(ren)) {
				isSwGL = true;
			}
			const lc = gl.getExtension('WEBGL_lose_context');
			if (lc) { lc.loseContext(); }
		}
	} catch (_e) {}
	window.rwSoftwareGL = isSwGL;

	// Only cap WebGL backing resolution on CPU software WebGL (WARP/SwiftShader) to crisp 1:1 1280x720.
	// On real hardware GPUs, keep native window.devicePixelRatio untouched for razor-sharp text/UI.
	if (isSwGL) {
		try {
			const dprDesc = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio')
				|| Object.getOwnPropertyDescriptor(Window.prototype, 'devicePixelRatio');
			const rawDpr = (dprDesc && typeof dprDesc.get === 'function')
				? function () { return dprDesc.get.call(window) || 1; }
				: (function (v) { return function () { return v; }; }(window.devicePixelRatio || 1));
			Object.defineProperty(window, 'devicePixelRatio', {
				configurable: true,
				get: function () {
					const dpr = rawDpr();
					const iw = Math.max(1, window.innerWidth || 1280);
					const ih = Math.max(1, window.innerHeight || 720);
					const cap = Math.min(1280 / iw, 720 / ih);
					return Math.max(0.5, Math.min(dpr, cap));
				},
			});
		} catch (_e) {}
	}

	if (!window.requestAnimationFrame || !window.cancelAnimationFrame) { return; }
	const origRAF = window.requestAnimationFrame.bind(window);
	const origCAF = window.cancelAnimationFrame.bind(window);
	const minFrameMs = isSwGL ? 22.0 : 12.8;   // ~40-45 FPS crisp 720p on software WebGL, ~60-75 FPS on GPU
	const active = new Map();
	let nextHandle = 1;
	let lastRunTs = -1e9;
	window.requestAnimationFrame = function (cb) {
		const handle = nextHandle++;
		function gate(ts) {
			if (!active.has(handle)) { return; }
			if (ts !== lastRunTs && (ts - lastRunTs) < minFrameMs) {
				active.set(handle, origRAF(gate));
				return;
			}
			active.delete(handle);
			lastRunTs = ts;
			cb(ts);
		}
		active.set(handle, origRAF(gate));
		return handle;
	};
	window.cancelAnimationFrame = function (handle) {
		const realId = active.get(handle);
		if (realId !== undefined) {
			active.delete(handle);
			origCAF(realId);
		}
	};

				}).then(function () {
					window.location.reload(true);
				}).catch(function () {
					window.location.reload(true);
				});
				return;
			}
		} catch (e) {
			console.warn('rwUpdateAndReload error:', e);
		}
		window.location.reload(true);
	};

	window.rwCanFullscreen = function () {
		return !window.rwPortal;   // portals (CrazyGames build) own full screen
	};
	window.rwIsFullscreen = function () {
		return !!(document.fullscreenElement || document.webkitFullscreenElement);
	};
	window.rwToggleFullscreen = function () {
		const exit = document.exitFullscreen || document.webkitExitFullscreen;
		if (window.rwIsFullscreen()) {
			if (exit) { Promise.resolve(exit.call(document)).catch(() => {}); }
			if (screen.orientation && screen.orientation.unlock) {
				try { screen.orientation.unlock(); } catch (_e) {}
			}
			return false;
		}
		const target = document.documentElement;
		const req = target.requestFullscreen || target.webkitRequestFullscreen;
		if (!req) {
			showFsTip();
			try { window.scrollTo(0, 1); } catch (_e) {}
			return false;
		}
		try {
			Promise.resolve(req.call(target)).then(() => {
				if (screen.orientation && screen.orientation.lock) {
					screen.orientation.lock('landscape').catch(() => {});
				}
				window.dispatchEvent(new Event('resize'));
			}, showFsTip);
		} catch (_e) {
			showFsTip();
		}
		return true;
	};
	document.addEventListener('fullscreenchange', () => window.dispatchEvent(new Event('resize')));
	document.addEventListener('webkitfullscreenchange', () => window.dispatchEvent(new Event('resize')));

	// iOS PWA / portrait helper: non-blocking top banner guiding landscape & Add to Home Screen
	let tipDismissed = false;
	let bannerTimer = 0;
	function setBanner(msg) {
		if (!msg) {
			if (fsTip.style.display === 'block' && !fsTipTimer) { fsTip.style.display = 'none'; }
			return;
		}
		if (fsTip.textContent !== msg) { fsTip.textContent = msg; }
		if (fsTip.style.display !== 'block') { fsTip.style.display = 'block'; }
	}
	function checkMobileBanner() {
		if (tipDismissed || fsTipTimer) { return; }
		const ua = navigator.userAgent || '';
		const ios = /iP(hone|od|ad)/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
		const touch = (navigator.maxTouchPoints || 0) > 0;
		const portrait = window.innerHeight > window.innerWidth;
		const standalone = !!(window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches));
		if (window.rwPortal) {
			setBanner(window.rwSoftwareGL ? '⚠ Browser Hardware Acceleration is OFF — turn it ON in browser settings for full 60 FPS & lowest CPU   ✕' : '');
		} else if (touch && portrait) {
			setBanner('↻ Rotate sideways for full-screen battle   ✕');
		} else if (ios && !standalone) {
			setBanner('iPhone full-screen: tap Share ↑ → Add to Home Screen   ✕');
		} else if (window.rwSoftwareGL) {
			setBanner('⚠ Browser Hardware Acceleration is OFF — turn it ON in browser settings for full 60 FPS & lowest CPU   ✕');
		} else {
			setBanner('');
		}
	}
	function scheduleBanner(ms) {
		clearTimeout(bannerTimer);
		bannerTimer = setTimeout(checkMobileBanner, ms);
	}
	fsTip.addEventListener('click', () => { tipDismissed = true; });
	window.addEventListener('resize', () => scheduleBanner(220));
	window.addEventListener('orientationchange', () => scheduleBanner(320));
	scheduleBanner(1800);
	function fail(err) {
		console.error(err);
		const msg = (err instanceof Error) ? err.message : (typeof err === 'string' ? err : 'An unknown error occurred.');
		notice.textContent = msg;
		notice.style.display = 'block';
		done = true;
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('Your browser is missing features this game needs:\n' + missing.join('\n'));
		return;
	}
	show(0);
	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				show(current / total * 90);
			}
		},
	}).then(() => {
		show(95);
		setTimeout(() => window.rwReady(), 30000);   // safety net: never leave the loader up for good
	}, fail);
}());
		</script>
	</body>
</html>
