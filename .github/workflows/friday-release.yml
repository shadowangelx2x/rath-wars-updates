name: Weekly Friday Release

on:
  schedule:
    # Fridays at 03:30 UTC (09:00 AM IST)
    - cron: '30 3 * * 5'
  workflow_dispatch:
    inputs:
      redeploy_latest:
        description: 'Re-deploy current Latest release to PWA & itch.io even if no draft exists'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Publish highest staged draft release (if any)
        id: pub
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REDEPLOY_LATEST: ${{ github.event.inputs.redeploy_latest }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys

          def ver_key(r):
              parts = [int(x) for x in re.findall(r"\d+", r.get("tag_name", ""))]
              return tuple(parts), r.get("created_at", "")

          repo = os.environ["REPO"]
          redeploy = str(os.environ.get("REDEPLOY_LATEST", "")).lower() == "true"
          raw = subprocess.check_output(["gh", "api", f"repos/{repo}/releases?per_page=50"], text=True)
          releases = json.loads(raw)
          drafts = sorted([r for r in releases if r.get("draft")], key=ver_key, reverse=True)
          published_existing = sorted(
              [r for r in releases if not r.get("draft")],
              key=ver_key,
              reverse=True,
          )
          live_ver = ver_key(published_existing[0])[0] if published_existing else ()
          valid = [d for d in drafts if ver_key(d)[0] > live_ver]
          stale = [d for d in drafts if ver_key(d)[0] <= live_ver]

          if valid:
              target = valid[0]
              stale.extend(valid[1:])
              tag = target["tag_name"]
              rid = target["id"]
              payload = json.dumps({"draft": False, "make_latest": "true"})
              subprocess.run(
                  ["gh", "api", "-X", "PATCH", f"repos/{repo}/releases/{rid}", "--input", "-"],
                  input=payload,
                  text=True,
                  check=True,
              )
              print(f"Published {tag} as Latest.")
              ver = tag.lstrip("v")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write(f"published_tag={tag}\n")
                  out.write(f"published_ver={ver}\n")
          elif redeploy and published_existing:
              tag = published_existing[0]["tag_name"]
              ver = tag.lstrip("v")
              print(f"Re-deploying existing Latest release {tag}.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write(f"published_tag={tag}\n")
                  out.write(f"published_ver={ver}\n")
          else:
              print("No draft newer than the latest published release.")

          for old_draft in stale:
              subprocess.run(
                  ["gh", "api", "-X", "DELETE", f"repos/{repo}/releases/{old_draft['id']}"],
                  check=True,
              )
          if stale:
              print(f"Cleaned up {len(stale)} superseded draft(s).")

          raw2 = subprocess.check_output(["gh", "api", f"repos/{repo}/releases?per_page=30"], text=True)
          published = sorted(
              [r for r in json.loads(raw2) if not r.get("draft")],
              key=lambda r: r.get("published_at") or r.get("created_at", ""),
              reverse=True,
          )
          for old in published[2:]:
              old_tag = old["tag_name"]
              subprocess.run(
                  ["gh", "release", "delete", old_tag, "--repo", repo, "--yes", "--cleanup-tag"],
                  check=True,
              )
              print(f"Removed old release {old_tag}")
          PY

      - name: Deploy iOS / iPad Fullscreen PWA to GitHub Pages
        if: steps.pub.outputs.published_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.pub.outputs.published_tag }}
        run: |
          mkdir -p /tmp/pwa_dl /tmp/gh_pages
          if ! gh release download "$TAG" --repo "$REPO" -p "RathWars_PWA.zip" -D /tmp/pwa_dl; then
            echo "No RathWars_PWA.zip asset attached to $TAG - skipping GitHub Pages update."
            exit 0
          fi
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" /tmp/gh_pages
          cd /tmp/gh_pages
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
          unzip -q /tmp/pwa_dl/RathWars_PWA.zip -d /tmp/gh_pages
          touch /tmp/gh_pages/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "PWA files unchanged."
          else
            git commit -m "Deploy Rath Wars PWA ${TAG}"
            git push origin gh-pages
            echo "Deployed Rath Wars PWA ${TAG} to GitHub Pages."
          fi

      - name: Push Web, Windows & Android builds to itch.io (when BUTLER_API_KEY secret is set)
        if: steps.pub.outputs.published_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.pub.outputs.published_tag }}
          VER: ${{ steps.pub.outputs.published_ver }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          export BUTLER_API_KEY="$(printf '%s' "$BUTLER_API_KEY" | tr -d '\r\n ')"
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "BUTLER_API_KEY secret not configured - skipping itch.io auto-push."
            exit 0
          fi
          mkdir -p /tmp/itch_dl /tmp/butler
          curl -fsSL -o /tmp/butler.zip "https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default"
          unzip -q /tmp/butler.zip -d /tmp/butler
          chmod +x /tmp/butler/butler
          gh release download "$TAG" --repo "$REPO" -p "RathWars_Web.zip" -p "RathWars.exe" -p "RathWars.apk" -D /tmp/itch_dl
          if [ -f /tmp/itch_dl/RathWars_Web.zip ]; then
            /tmp/butler/butler push /tmp/itch_dl/RathWars_Web.zip shadowangelx2x/rath-wars:html5 --userversion "$VER"
          fi
          if [ -f /tmp/itch_dl/RathWars.exe ]; then
            /tmp/butler/butler push /tmp/itch_dl/RathWars.exe shadowangelx2x/rath-wars:windows --userversion "$VER"
          fi
          if [ -f /tmp/itch_dl/RathWars.apk ]; then
            /tmp/butler/butler push /tmp/itch_dl/RathWars.apk shadowangelx2x/rath-wars:android --userversion "$VER"
          fi
          echo "Pushed ${TAG} builds to itch.io."
